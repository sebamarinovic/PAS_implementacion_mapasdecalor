# Configuración de la carga de avisos SAP (mantenimiento) para cruzarlos
# con los informes PAS. Ver import_avisos_sap.py y core/avisos_sap.py.
#
# 2026-09-21: primera carga, a pedido de Sebastián, con el archivo
# AVISOS_MANT_01_JUNIO_EN_ADELANTE.xlsx (634 avisos totales).

# Sólo se importan avisos cuyo "Pto.tbjo.responsable" esté en esta lista.
# Editable sin tocar código — si más adelante se agregan más puntos de
# trabajo, basta con sumarlos aquí y volver a correr import_avisos_sap.py.
puntos_trabajo_incluidos:
  - CFUMPM01
  - CFUMPE02
  - CFUMPI02

# Mapeo del prefijo de "Ubicación técnica" (primeros 3 segmentos, ej.
# "CHFU-AC-PA3") a la planta PAS correspondiente. Sólo se completan los
# prefijos con evidencia clara (coinciden con la nomenclatura de subtrenes
# ya confirmada en config/process_lines.yaml, o con TAGs de equipos ya
# validados en config/rules.yaml). El resto de los avisos SAP quedan con
# planta_inferida = null ("Sin identificar planta") en vez de adivinar.
mapeo_ubicacion_tecnica_planta:
  CHFU-AC-G2A:
    planta: GCP2
    validado: true
    fuente_validacion: >
      Coincide con la nomenclatura oficial de subtrenes GCP-2A confirmada
      por SP916744-53200-48EC-S0001 rev.2 §13.2 (ver PAS - Línea de
      Proceso y Enfriamiento).
  CHFU-AC-G2B:
    planta: GCP2
    validado: true
    fuente_validacion: "Análogo a CHFU-AC-G2A (subtren GCP-2B)."
  CHFU-AC-G4A:
    planta: GCP4
    validado: true
    fuente_validacion: "Análogo a CHFU-AC-G2A (subtren GCP-4A)."
  CHFU-AC-G4B:
    planta: GCP4
    validado: true
    fuente_validacion: "Análogo a CHFU-AC-G2A (subtren GCP-4B)."
  CHFU-AC-PA3:
    planta: CAP3
    validado: true
    fuente_validacion: "Prefijo de planta consistente con CAP-3 en toda la muestra revisada (balance ácido, instrumentación, etc.)."
  CHFU-AC-PA4:
    planta: CAP4
    validado: true
    fuente_validacion: "Análogo a CHFU-AC-PA3, para CAP-4."
  CHFU-AC-REF:
    planta: "Circuito de aguas"
    validado: true
    fuente_validacion: >
      Confirmado directamente: los avisos con TAG BOC-901/902/904/905
      (bombas de torres de enfriamiento, ya validadas en config/rules.yaml
      grupos AGUAS-BOC-901/904) caen bajo este prefijo
      (ej. CHFU-AC-REF-TOR-BBA04).

# Prefijos vistos en la muestra que NO corresponden a ninguna de las 5
# plantas PAS (Almacenamiento, Efluentes, Sumideros, etc.) — quedan fuera
# de alcance a propósito, no se fuerza un mapeo. Ejemplos encontrados:
# CHFU-AC-ALM, CHFU-AC-EAP, CHFU-AC-SDE, CHFU-AC-SUM, CHFU-EF-ADC,
# CHFU-EF-ANE, CHFU-EF-FIL.
